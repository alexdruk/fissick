name: Build macOS DMGs

on:
  push:
    branches: [master]
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest      # Apple Silicon runner
          - arch: x64
            runner: macos-13          # Intel runner

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.arch }} DMG

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate .icns icon
        run: iconutil -c icns assets/icon.iconset -o assets/icon.icns

      - name: Build DMG (${{ matrix.arch }})
        run: npm run build:mac:${{ matrix.arch }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fissick-${{ matrix.arch }}
          path: out/make/**/*.dmg
          retention-days: 30
